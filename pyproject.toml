[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depthwizard"
version = "0.1.0"
description = "Single-View Height Estimation and 3D Flythrough from optical imagery."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "rasterio>=1.5.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.18.1",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.46.0",
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "trimesh>=5.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/depthwizard"]

[tool.pyright]
extraPaths = ["src"]
